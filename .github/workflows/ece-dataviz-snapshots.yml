name: ECE Data Visualisation - snapshots

on:
  workflow_dispatch:
  push:
    paths:
      - 'ece-data-visualisation/scripts/prepare_data.py'
      - '.github/workflows/ece-dataviz-snapshots.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'pyarrow>=18,<24'
      - name: Prepare and verify datasets
        run: python ece-data-visualisation/scripts/prepare_data.py
      - name: Commit verified snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ece-data-visualisation/uber/uber_apr2014.csv ece-data-visualisation/nyc_trips/green_taxi_2025_01.csv ece-data-visualisation/MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "Add verified historical mobility snapshots"
            git push
          fi
